# Smithery Configuration
# See https://smithery.ai/docs/config for more details

name: mysql-mcp-guard
version: 0.1.0
description: Educational MCP server for MySQL with safe guardrails and SQL tutoring.
author: adiego-101
repository: https://github.com/adiego-101/unimysql-mcp-ts
license: MIT

# Configuration for the server
config:
  MYSQL_HOST:
    type: string
    description: MySQL host (default: localhost)
    default: localhost
  MYSQL_USER:
    type: string
    description: MySQL user
    required: true
  MYSQL_PASSWORD:
    type: string
    description: MySQL password
    secret: true
  MYSQL_DATABASE:
    type: string
    description: MySQL database name
    required: true

# Runtime environment
runtime: node
startCommand: npx -y mysql-mcp-guard
