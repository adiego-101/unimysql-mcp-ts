name: Build and Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: unimysql-mcp-ts/package-lock.json
    - name: Install dependencies
      working-directory: unimysql-mcp-ts
      run: npm install
    - name: Build
      working-directory: unimysql-mcp-ts
      run: npm run build
