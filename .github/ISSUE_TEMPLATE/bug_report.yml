name: Bug report
description: Create a report to help us improve UniMySQL-MCP
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you did and what went wrong...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Your Environment
      description: OS, Node.js version, MySQL version, etc.
      placeholder: Linux Ubuntu 24.04, Node 22, MySQL 8.0
    validations:
      required: true
